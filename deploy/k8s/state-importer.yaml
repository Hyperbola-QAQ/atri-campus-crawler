apiVersion: v1
kind: Pod
metadata:
  name: crawler-state-importer
  namespace: atri-campus-crawler
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 2000
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: importer
      image: 192.168.86.100:30500/ca-clean/uv@sha256:09cb6a6dff5885d14aeca24b4e8a4d463ed938784ceeef2c154da167e938b121
      imagePullPolicy: IfNotPresent
      command: [sh, -c, "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: state
          mountPath: /var/lib/crawler
  volumes:
    - name: state
      persistentVolumeClaim:
        claimName: crawler-state
