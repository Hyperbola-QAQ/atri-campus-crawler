apiVersion: v1
kind: Pod
metadata:
  name: crawler-state-importer
  namespace: university-crawler
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 2000
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: importer
      image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
      imagePullPolicy: IfNotPresent
      command: [sh, -c, "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: state
          mountPath: /var/lib/crawler
  volumes:
    - name: state
      persistentVolumeClaim:
        claimName: crawler-state
