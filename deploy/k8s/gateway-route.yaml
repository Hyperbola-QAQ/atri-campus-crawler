apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: university-crawler
  namespace: atri-university-crawler
spec:
  hostnames:
    - university-crawler.hyperbola.cc
  parentRefs:
    - name: higress-gateway
      namespace: higress-system
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/electricity/
      backendRefs:
        - name: university-crawler
          port: 8000
