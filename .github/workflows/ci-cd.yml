name: CI and Kubernetes deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check .
      - name: Formatting baseline
        continue-on-error: true
        run: uv run --no-sync ruff format --check .
      - name: Type checking (existing diagnostics tracked separately)
        continue-on-error: true
        run: uv run --no-sync ty check
      - name: Offline tests
        run: uv run --no-sync pytest -m 'not integration and not infrastructure and not electricity_live' --junitxml=test-results.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-test-reports
          path: |
            coverage.xml
            coverage.json
            test-results.xml
          if-no-files-found: ignore

  deploy:
    needs: ci
    if: >-
      vars.ENABLE_PRODUCTION_DEPLOY == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && vars.ENABLE_AUTO_DEPLOY == 'true'))
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER_LABELS || '["self-hosted","linux","atri-deploy"]') }}
    timeout-minutes: 30
    environment: production
    concurrency:
      group: crawler-kubernetes-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish source and wait for rollout
        shell: bash
        env:
          PRESERVE_RUNTIME_SECRETS: "true"
          K8S_SSH_TARGET: ${{ vars.K8S_SSH_TARGET || 'hyperbola@192.168.86.11' }}
          SSH_CONFIG: ${{ vars.SSH_CONFIG || '/dev/null' }}
          RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/k8s/deploy.sh
