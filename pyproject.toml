[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["adapter*", "schemas*", "services*", "utils*"]
namespaces = true

[project]
name = "atri-crawler"
description = "ATRI爬虫模块 - 更快、更稳、更易维护的爬虫微服务"
version = "0.1.0"
authors = [
    { name = "Hyperbola", email = "2656131980@qq.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx",
    "loguru",
    "redis",
    "ddddocr",
    "lxml",
    "xlrd",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "aiofiles>=25.1.0",
]


[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "integration: performs requests to the live HNUCM service",
    "infrastructure: connects to a local Redis service",
    "electricity_live: queries a running API and the real electricity portal",
]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".git", "__pycache__", "build", "dist", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[tool.ty.environment]
python-version = "3.10"
